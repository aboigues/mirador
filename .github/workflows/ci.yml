name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer uv
        run: pip install uv

      - name: Installer les dépendances
        run: uv pip install --system -e ".[dev]"

      - name: Tests unitaires
        run: pytest tests/unitaire/ -v --tb=short

      - name: Tests d'intégration (sans infrastructure externe)
        run: pytest tests/integration/ -v --tb=short

  secrets:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique : un secret ajouté puis retiré reste une fuite

      - name: Installer gitleaks (binaire épinglé + somme vérifiée)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scanner l'historique
        run: gitleaks git --no-banner --redact --verbose .

      # `gitleaks git` lit des diffs, où git masque le contenu des fichiers
      # binaires (un swap vim en est un). Le scan de l'arbre lit les fichiers.
      - name: Scanner l'arbre (fichiers binaires compris)
        run: gitleaks dir --no-banner --redact --verbose .
