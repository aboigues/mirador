name: Déploiement Scaleway

# Déploiement continu : met à jour le CODE des fonctions à chaque push sur master
# touchant le code applicatif. Les secrets/env des fonctions ne sont PAS modifiés
# (posés une fois par infra/scaleway/deploy.sh). Le job n'a donc besoin que des
# credentials Scaleway, pas des secrets applicatifs.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "handler.py"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: deploy-scaleway
  cancel-in-progress: false

env:
  SCW_VERSION: "2.56.3"
  # Clé IAM de l'application `mirador-deploy` (Functions seulement), exposée sous
  # les noms qu'attend la CLI scw.
  SCW_ACCESS_KEY: ${{ secrets.SCW_DEPLOY_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_DEPLOY_SECRET_KEY }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
  # Org id : identifiant non sensible, requis par certaines commandes scw (ex.
  # `function namespace list`) quand aucun fichier de config n'est présent (CI).
  SCW_DEFAULT_ORGANIZATION_ID: 0a3e5b10-4caa-4048-a607-f53080c01569
  SCW_DEFAULT_REGION: fr-par
  SCW_PROFILE: "" # utilise les credentials d'environnement, pas un profil

# Moindre privilège : le GITHUB_TOKEN ne fait que lire le dépôt (checkout).
permissions:
  contents: read

jobs:
  deploy:
    name: Mise à jour du code des fonctions
    runs-on: ubuntu-latest
    env:
      PIP: pip # update_code.sh vendorise les wheels musllinux avec ce pip (python 3.12)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer la CLI scw
        run: |
          curl -fsSL -o /usr/local/bin/scw \
            "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}/scaleway-cli_${SCW_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/scw
          scw version

      - name: Déployer le code (webhook + traitement)
        run: |
          set -euo pipefail
          # project-id explicite : la clé IAM est scopée projet (pas d'org par
          # défaut), donc `namespace list` sans project-id échoue sur
          # « organization ID is required ».
          NS_ID=$(scw function namespace list project-id="$SCW_DEFAULT_PROJECT_ID" region="$SCW_DEFAULT_REGION" -o json \
            | python3 -c "import sys,json;print(next(n['id'] for n in json.load(sys.stdin) if n['name']=='mirador'))")
          echo "namespace mirador = $NS_ID"
          for fn in webhook traitement; do
            FN_ID=$(scw function function list namespace-id="$NS_ID" region="$SCW_DEFAULT_REGION" -o json \
              | python3 -c "import sys,json;print(next(f['id'] for f in json.load(sys.stdin) if f['name']=='$fn'))")
            echo "→ déploiement de $fn ($FN_ID)"
            bash infra/scaleway/update_code.sh "$FN_ID"
          done
