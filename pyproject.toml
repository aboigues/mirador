[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirador"
version = "1.0.0"
description = "Surveillance pipeline CI/CD GitHub Actions avec agents IA"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "PyGitHub>=2.9.1",
    "PyJWT>=2.9.0",
    "boto3>=1.43.17",
    "anthropic>=0.105.2",
    "structlog>=25.5.0",
    "SQLAlchemy>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "psycopg2-binary>=2.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres]>=4.9.0",
    "respx>=0.21.0",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
